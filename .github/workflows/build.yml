name: Test builds
# A debug APK from any branch, to try a change on a phone before it is released. Started by hand
# (Actions → Test builds → Run workflow); signed releases come from release.yml.
# It is signed with a debug key, so it cannot install over the released app: uninstall that
# first (its machines and pairing go with it), or use another phone.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/mob-android_test_${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: mob-android-test
          path: out/*
          if-no-files-found: error
          retention-days: 14
