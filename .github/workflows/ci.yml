name: CI
# Checks every push to main and every pull request to main (other branches run nothing until a
# pull request is open); it makes no downloads, see build.yml for those.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Release tools
        run: node --test .github/release/*.test.mjs
